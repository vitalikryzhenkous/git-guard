# Общий минимум git-guard. Репо добавляет своё в .git-guard.yaml (списки складываются).
max_files: 30
max_bytes: 1048576
deny_names:
  - pipeline.yaml
  - log.jsonl
env_prefix: .env
env_allow:
  - .env.example
  - .env.sample
  - .env.template
# регулярки по пути (компоненты каталогов)
path_patterns:
  - (^|/)(Users|AppData)/
  - (^|/)[^/]*(Chrome|Lighthouse)[^/]*/
  - (^|/)[^/]*profile[^/]*/
# дополняется в .git-guard.yaml репо
deny_dirs:
# термины блокируют везде; исключение — явный allow: "- путь-или-glob | причина"
allow_terms:
